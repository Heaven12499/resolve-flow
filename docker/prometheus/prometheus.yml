global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: resolveflow-business
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["business-api:8080"]

  - job_name: resolveflow-ai
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
