services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: resolve_flow
      MYSQL_USER: resolve_flow
      MYSQL_PASSWORD: resolve_flow
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    image: mysql:8.4
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mysql -h db -uroot -proot -e
        "CREATE DATABASE IF NOT EXISTS resolveflow_business CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        CREATE DATABASE IF NOT EXISTS resolveflow_ai CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        CREATE USER IF NOT EXISTS 'resolve_flow'@'%' IDENTIFIED BY 'resolve_flow';
        GRANT ALL PRIVILEGES ON resolveflow_business.* TO 'resolve_flow'@'%';
        GRANT ALL PRIVILEGES ON resolveflow_ai.* TO 'resolve_flow'@'%';
        FLUSH PRIVILEGES;"
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://resolve_flow:resolve_flow@db:3306/resolveflow_ai?charset=utf8mb4
      AUTO_CREATE_TABLES: "false"
      SEED_DEMO_DATA: "true"
      LEGACY_BUSINESS_API_ENABLED: "false"
      AI_PROVIDER: ${AI_PROVIDER:-rules}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-12}
      SUPERVISOR_LLM_PROVIDER: ${SUPERVISOR_LLM_PROVIDER:-}
      SUPERVISOR_LLM_MODEL: ${SUPERVISOR_LLM_MODEL:-}
      REFUND_ANALYST_LLM_PROVIDER: ${REFUND_ANALYST_LLM_PROVIDER:-}
      REFUND_ANALYST_LLM_MODEL: ${REFUND_ANALYST_LLM_MODEL:-}
      CASE_MANAGER_LLM_PROVIDER: ${CASE_MANAGER_LLM_PROVIDER:-}
      CASE_MANAGER_LLM_MODEL: ${CASE_MANAGER_LLM_MODEL:-}
      LOGISTICS_RESOLUTION_LLM_PROVIDER: ${LOGISTICS_RESOLUTION_LLM_PROVIDER:-}
      LOGISTICS_RESOLUTION_LLM_MODEL: ${LOGISTICS_RESOLUTION_LLM_MODEL:-}
      REFUND_INVESTIGATION_LLM_PROVIDER: ${REFUND_INVESTIGATION_LLM_PROVIDER:-}
      REFUND_INVESTIGATION_LLM_MODEL: ${REFUND_INVESTIGATION_LLM_MODEL:-}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      CHROMA_HOST: ${CHROMA_HOST:-chroma}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-resolveflow_knowledge_chunks}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.58}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-512}
      ANONYMIZED_TELEMETRY: "false"
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-60}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      AUTH_SUPERVISOR_USERNAME: ${AUTH_SUPERVISOR_USERNAME:-supervisor}
      AUTH_SUPERVISOR_PASSWORD: ${AUTH_SUPERVISOR_PASSWORD:-}
      AUTH_AGENT_USERNAME: ${AUTH_AGENT_USERNAME:-agent}
      AUTH_AGENT_PASSWORD: ${AUTH_AGENT_PASSWORD:-}
      AGENT_COUPON_APPROVAL_LIMIT: ${AGENT_COUPON_APPROVAL_LIMIT:-5}
      PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-resolveflow-local-internal-token}
    ports:
      - "8000:8000"
    volumes:
      - embedding_cache:/models/huggingface
    depends_on:
      db-init:
        condition: service_completed_successfully
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  business-api:
    build:
      context: ./business-service
    environment:
      BUSINESS_DATABASE_URL: jdbc:mysql://db:3306/resolveflow_business?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      BUSINESS_DATABASE_USERNAME: resolve_flow
      BUSINESS_DATABASE_PASSWORD: resolve_flow
      REDIS_HOST: redis
      AI_SERVICE_URL: http://api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-resolveflow-local-internal-token}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-3}
      AI_INITIAL_BACKOFF: ${AI_INITIAL_BACKOFF:-2s}
      AI_MAX_BACKOFF: ${AI_MAX_BACKOFF:-30s}
      AI_WORKER_LEASE_DURATION: ${AI_WORKER_LEASE_DURATION:-45s}
      AI_DISPATCH_POLL_INTERVAL: ${AI_DISPATCH_POLL_INTERVAL:-2s}
      AI_DISPATCH_BATCH_SIZE: ${AI_DISPATCH_BATCH_SIZE:-20}
      AI_REDIS_COORDINATION_ENABLED: "true"
      AI_DISPATCH_LOCK_TTL: ${AI_DISPATCH_LOCK_TTL:-10s}
      JWT_SECRET: ${BUSINESS_JWT_SECRET:-change-this-local-demo-secret-at-least-32-characters}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin123456}
      AUTH_SUPERVISOR_PASSWORD: ${AUTH_SUPERVISOR_PASSWORD:-supervisor123456}
      AUTH_AGENT_PASSWORD: ${AUTH_AGENT_PASSWORD:-agent123456}
      SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      business-api:
        condition: service_healthy

  chroma:
    image: chromadb/chroma:0.6.3
    environment:
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - chroma_data:/chroma/chroma

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  chroma_data:
  embedding_cache:
  redis_data:
