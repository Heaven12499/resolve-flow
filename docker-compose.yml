services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: resolve_flow
      MYSQL_USER: resolve_flow
      MYSQL_PASSWORD: resolve_flow
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://resolve_flow:resolve_flow@db:3306/resolve_flow?charset=utf8mb4
      AUTO_CREATE_TABLES: "false"
      SEED_DEMO_DATA: "true"
      AI_PROVIDER: ${AI_PROVIDER:-rules}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-12}
      REFUND_ANALYST_LLM_PROVIDER: ${REFUND_ANALYST_LLM_PROVIDER:-}
      REFUND_ANALYST_LLM_MODEL: ${REFUND_ANALYST_LLM_MODEL:-}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      CHROMA_HOST: ${CHROMA_HOST:-chroma}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-resolveflow_knowledge_chunks}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.25}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-512}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-60}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      AUTH_SUPERVISOR_USERNAME: ${AUTH_SUPERVISOR_USERNAME:-supervisor}
      AUTH_SUPERVISOR_PASSWORD: ${AUTH_SUPERVISOR_PASSWORD:-}
      AUTH_AGENT_USERNAME: ${AUTH_AGENT_USERNAME:-agent}
      AUTH_AGENT_PASSWORD: ${AUTH_AGENT_PASSWORD:-}
      AGENT_COUPON_APPROVAL_LIMIT: ${AGENT_COUPON_APPROVAL_LIMIT:-5}
      PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
    ports:
      - "8000:8000"
    volumes:
      - embedding_cache:/models/huggingface
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

  chroma:
    image: chromadb/chroma:0.6.3
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  mysql_data:
  chroma_data:
  embedding_cache:
